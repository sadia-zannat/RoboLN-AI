name: RoboLN release checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      MODEL_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      ROBOLN_DATABASE_URL: sqlite:////tmp/roboln-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: python scripts/verify_migration.py
      - run: python scripts/verify_industrial_migration.py
      - run: python scripts/verify_copilot_migration.py
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: python scripts/smoke_fullstack_http.py
      - run: python scripts/smoke_copilot_http.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:e2e:copilot
        working-directory: frontend
